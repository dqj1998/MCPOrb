[package]
name = "mcporb-gateway-core"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "MCPOrb Gateway core — aggregate multiple Orbs behind a single MCP endpoint"

[dependencies]
mcporb-runtime-core = { path = "../mcporb-runtime-core" }
mcporb-runtime-app-core = { path = "../mcporb-runtime-app-core" }
tokio = { workspace = true, features = ["process", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
notify = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
