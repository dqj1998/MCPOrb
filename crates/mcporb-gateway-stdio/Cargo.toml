[package]
name = "mcporb-gateway-stdio"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MCPOrb Gateway STDIO — single STDIO MCP endpoint routing to multiple Orbs"

[dependencies]
mcporb-gateway-core = { path = "../mcporb-gateway-core" }
tokio = { workspace = true, features = ["io-util", "process"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
