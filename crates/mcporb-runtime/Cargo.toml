[package]
name = "mcporb-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[[bin]]
name = "mcporb-runtime"
path = "src/main.rs"

[features]
# Build with bundled tract embedder. ON by default for the "full" flavor
# distributed with Orbs that carry dense vectors. Turn OFF for BM25-only
# deployments to save ~5-10MB of binary (tract + tokenizers + onnx).
#
#     cargo build -p mcporb-runtime                          # full
#     cargo build -p mcporb-runtime --no-default-features    # lite (BM25-only)
default = ["vector-embedder"]
vector-embedder = ["dep:mcporb-embed"]

[dependencies]
mcporb-runtime-core = { path = "../mcporb-runtime-core" }
mcporb-embed = { path = "../mcporb-embed", optional = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
webbrowser = { workspace = true }
rust-embed = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }
postcard = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = { workspace = true }
# Password access / key derivation (see plans/orb-password-access-plan.md).
argon2 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
chacha20poly1305 = { workspace = true }
# Remember-on-device (Phase 5): OS keychain + hidden terminal prompt for --unlock.
keyring = { workspace = true }
rpassword = "7"

# macOS single-file `.orb`s embed the bundle as a signed Mach-O segment
# (`__MCPORB,__assets`) so `codesign --strict` passes and the file can be
# notarized (plan §3.8.1 / ADR-5). Reading that segment needs a Mach-O parser;
# linux/windows use the appended footer and never pull this in.
[target.'cfg(target_os = "macos")'.dependencies]
object = { version = "0.36", default-features = false, features = ["read_core", "macho", "std"] }

[dev-dependencies]
tempfile = { workspace = true }
