[package]
name = "mcporb-runtime-app"
version = "1.3.5"
edition = "2021"
license = "Apache-2.0"
description = "MCPOrb Runner — install, search, and run Orb ZIP knowledge bases"
build = "build.rs"

[[bin]]
name = "mcporb-runner"
path = "src/main.rs"

[features]
default = ["mas"]
mas = []
direct-download = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mcporb-runtime-app-core = { path = "../mcporb-runtime-app-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["process", "signal", "net", "io-util", "macros"] }
rand = "0.8"
sha2 = { workspace = true }
base64 = { workspace = true }
dirs = "5"
libc = "0.2"
local-ip-address = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = { workspace = true }


